[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidclip"
version = "0.1.0"
description = "Offline-first video highlight detection and short-form clipping"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Henry Harrison" }]
dependencies = []

[project.scripts]
vidclip = "vidclip.cli:main"

[tool.setuptools]
packages = ["vidclip"]
